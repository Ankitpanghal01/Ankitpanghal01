name: Profile assets

# Builds the live cards and contribution snake, then publishes them to the
# `output` branch. README images read from there, so main stays free of bot commits.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build GitHub and LeetCode cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/build_stats.py dist

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#161B22,#3B1D6E,#6D28D9,#A855F7,#22D3EE

      - name: Publish to output branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: dist
        run: |
          git init -q -b output
          git add .
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update profile assets"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
